<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="카페 메뉴 탐색과 사용자 맞춤 화면을 체험하는 비공식 데모입니다.">
  <title>카페 메뉴 데모</title>
  <link rel="stylesheet" href="./cafe.css">
  <script type="module" src="./cafe.js"></script>
  <meta name="webagent-api-origin" content="https://webagent-kiosk-demo-vercel-demo.vercel.app">
</head>
<body class="wa-shopping-enabled" data-public-cafe-only>
  <div id="cafe-app" class="cafe-app">
    <header id="cafe-header" class="cafe-header" data-wa-protected="true" data-wa-no-gaze="true"></header>
    <main class="cafe-page">
      <section id="cafe-intro" class="cafe-intro"></section>
      <section id="cafe-assistant" class="cafe-assistant" data-wa-ignore="true" aria-label="맞춤 화면 요청"></section>
      <section id="cafe-reading" class="wa-gaze-reading-surface cafe-reading" data-wa-id="region.storefront.gaze" data-wa-role="region" data-wa-label="선택한 카페 메뉴의 읽기와 맞춤 화면 영역"><p class="cafe-reading-placeholder">메뉴를 보고 요청하면 이곳에 보기 쉬운 화면이 나타납니다.</p></section>
      <div id="cafe-content"></div>
    </main>
    <footer class="cafe-footer" data-wa-protected="true" data-wa-no-gaze="true">비공식 연구 시제품 · 예시 메뉴와 가격 · 실제 주문 및 결제 없음</footer>
  </div>
  <aside id="cafe-gaze" data-wa-ignore="true" data-wa-gaze-ui="true"></aside>
</body>
</html>
